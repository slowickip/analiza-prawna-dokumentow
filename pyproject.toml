[project]
name = "contract-analyzer"
version = "1.0.0"
description = "Polish contract analysis research artefact"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
# What both the corpus seeder and the analysis backend need. The seeder is a
# one-shot build job: it reads ELI, cuts acts into units, encodes them and writes
# them to the vector store. Everything below is on that path, and its import
# closure was measured rather than assumed.
dependencies = [
    "pydantic>=2.11,<3",
    "httpx>=0.28,<1",
    "numpy>=2.1,<3",
    "pdfplumber>=0.11,<1",
    "qdrant-client>=1.19,<2",
    # The chat and embedding transport: one SDK for every OpenAI-compatible call.
    "openai>=2.45,<4",
]

[dependency-groups]
# The analysis backend only: the HTTP surface, the agent runtime, the metadata
# store and the document formats a user can upload. The seeder imports none of
# it, and used to ship all of it -- a one-shot build job carrying a web
# framework, an agent runtime and a Postgres driver.
backend = [
    # The floor is the version this artefact is locked and tested against:
    # api/runs.py imports fastapi.sse, which earlier releases in the range lack.
    "fastapi>=0.141,<1",
    "uvicorn>=0.34,<1",
    "python-multipart>=0.0.20,<1",
    "python-docx>=1.1,<2",
    # ingest/docx.py catches lxml's parse error directly, so it is ours to
    # declare rather than python-docx's to keep providing.
    "lxml>=5.3,<7",
    "pypdfium2>=4.30,<5",
    "pillow>=11.0,<12",
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
    "langchain>=1.4,<2",
    "langgraph>=1.2,<2",
]
# Scoring the saved answers only. The judge SDK ships its own pinned Codex
# runtime, which neither the analysis backend nor the corpus seeder has any use
# for, so both images exclude this group explicitly.
evaluation = [
    "openai-codex==0.147.0",
]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
    "fpdf2>=2.8,<3",
    "pypdf>=5.0,<6",
    "pytest-xdist>=3.8,<4",
    # The SDK's HTTP layer, which the embedding and model tests drive over mock
    # transports. It arrives through openai either way; naming it here is what
    # stops the suite breaking silently if the SDK ever changes client.
    "httpx2>=2.7,<3",
    # The tests read compose.yaml and openapi.yaml, and drive the app through
    # Starlette's test client. Both used to arrive through other packages.
    "pyyaml>=6.0,<7",
    # measure_evaluation_ingestion.py loads a tokenizer file when one is passed,
    # which is how evaluation-data/README.md documents the token measurement.
    "tokenizers>=0.20,<1",
    "starlette>=1.6,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "backend/src/contract_analyzer",
    "seeder/src/seeder",
]

[tool.uv]
# All three groups are installed by default, so a developer, the test suite and
# CI all see the whole artefact. The two images are where that is narrowed.
default-groups = ["dev", "backend", "evaluation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto"
pythonpath = ["backend/src", "seeder/src", "tests"]

[tool.ruff]
target-version = "py312"
src = ["backend/src", "seeder/src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["contract_analyzer", "seeder"]
mypy_path = ["backend/src", "seeder/src"]
